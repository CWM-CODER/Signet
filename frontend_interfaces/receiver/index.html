<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiver Interface (Voice & Text)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="title">
                <h2>Interpreter Dashboard</h2>
                <div id="connection-status" style="font-size: 12px; color: #666;">🔴 Connecting...</div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="languageSelect">Translate:</label>
                    <select id="languageSelect">
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="ttsToggle">Voice:</label>
                    <input type="checkbox" id="ttsToggle" checked>
                </div>
            </div>
        </header>

        <div id="chat-container" class="chat-container">
            <div class="system-msg">Waiting for messages from Signer...</div>
        </div>

        <div class="input-area">
            <input type="text" id="replyInput" placeholder="Type a reply..." autocomplete="off">
            <button onclick="sendReply()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
